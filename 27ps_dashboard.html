<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>27PS 発注ダッシュボード</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap');
:root{
  --bg:#F4F4F2; --s1:#FFFFFF; --s2:#F0EEE9; --s3:#E8E5DF;
  --border:#D4CFC7; --border2:#B8B2A8;
  --text:#1A1814; --muted:#6B6560; --sub:#4A4540;
  --gold:#9A6F2E; --blue:#2666AA; --green:#1E8A4A;
  --up:#1E8A4A; --dn:#C0392B; --neu:#6B6560;
  --mono:'DM Mono',monospace; --sans:'Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* ── Header ── */
.hdr{height:50px;background:var(--s1);border-bottom:1px solid var(--border);
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  display:flex;align-items:center;padding:0 18px;gap:14px;flex-shrink:0}
.hdr-mark{width:24px;height:24px;border:2px solid var(--gold);border-radius:2px;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--gold);font-family:var(--mono);font-weight:500}
.hdr-title{font-size:13px;font-weight:500;flex:1;letter-spacing:.04em}
.hdr-badge{font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em;
  background:var(--s3);padding:3px 8px;border-radius:2px;border:1px solid var(--border)}
.seg{display:flex;background:var(--s3);border:1px solid var(--border);border-radius:3px;overflow:hidden}
.seg-btn{padding:4px 11px;font-size:11px;font-family:var(--sans);color:var(--muted);
  background:transparent;border:none;cursor:pointer;transition:.15s;white-space:nowrap}
.seg-btn:hover{color:var(--text)}
.seg-btn.on{background:var(--gold);color:#FFFFFF;font-weight:600}
.store-sel{background:var(--s3);border:1px solid var(--border);color:var(--text);
  font-family:var(--sans);font-size:12px;padding:5px 8px;border-radius:3px;cursor:pointer;outline:none;max-width:230px}
.store-sel option{background:var(--s2)}

/* ── Nav ── */
.nav{display:flex;background:var(--s1);border-bottom:1px solid var(--border);padding:0 18px;flex-shrink:0}
.nav-tab{padding:11px 15px;font-size:12px;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;transition:.15s;letter-spacing:.04em;font-weight:500}
.nav-tab:hover{color:var(--text)}
.nav-tab.on{color:var(--gold);border-bottom-color:var(--gold)}

/* ── KPI ── */
.kpi-strip{display:flex;gap:1px;background:var(--border);border-bottom:1px solid var(--border);flex-shrink:0}
.kpi{flex:1;background:var(--s1);padding:10px 16px;min-width:0;overflow:hidden}
.kpi-lbl{font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-family:var(--mono)}
.kpi-val{font-size:20px;font-weight:700;color:var(--text);font-family:var(--mono);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-sub{font-size:11px;margin-top:3px;display:flex;align-items:center;gap:5px}
.up{color:var(--up)} .dn{color:var(--dn)} .neu{color:var(--muted)}

/* ── Layout ── */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.pane{display:none;height:100%;overflow-y:auto;overflow-x:hidden}
.pane.on{display:flex;flex-direction:column}
.cgrid{display:grid;gap:12px;padding:14px 18px}
.g2{grid-template-columns:1fr 1fr}
.g1{grid-template-columns:1fr}
.ccard{background:var(--s1);border:1px solid var(--border);border-radius:5px;padding:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ccard-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ctitle{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono)}
.cwrap{position:relative}

/* ── 凡例トグルボタン ── */
.leg-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.leg-btn{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:10px;
  font-size:11px;color:var(--muted);border:1px solid var(--border);
  background:transparent;cursor:pointer;transition:.15s;font-family:var(--sans)}
.leg-btn:hover{color:var(--text)}
.leg-btn.on{border-color:currentColor}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.leg-dash{width:16px;height:0;flex-shrink:0}

/* ── 100% 積み上げ棒グラフ用 ── */
.stacked100-wrap{display:flex;flex-direction:column;gap:10px;padding:4px 0}
.s100-row{display:grid;grid-template-columns:52px 1fr 60px;align-items:center;gap:8px}
.s100-lbl{font-size:11px;color:var(--sub);font-family:var(--mono);text-align:right;white-space:nowrap}
.s100-bar{height:22px;display:flex;border-radius:3px;overflow:hidden;position:relative}
.s100-seg{height:100%;transition:.3s;position:relative;overflow:hidden}
.s100-seg:hover::after{content:attr(data-tip);position:absolute;top:-28px;left:50%;transform:translateX(-50%);
  background:#333;color:#eee;font-size:10px;padding:2px 7px;border-radius:3px;white-space:nowrap;z-index:99;pointer-events:none}
.s100-total{font-size:10px;color:var(--muted);font-family:var(--mono);text-align:right}
.s100-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.s100-leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--sub)}
.s100-leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── Chart heights ── */
.h300{height:300px} .h320{height:320px} .h360{height:360px} .h380{height:380px}

/* ── Bar rows (brand/item tab) ── */
.brow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.blbl{font-size:11px;color:var(--text);width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.bouter{flex:1;height:16px;background:var(--s3);border-radius:2px;overflow:visible;position:relative}
.binner{height:100%;border-radius:2px;transition:.3s;position:relative;z-index:1}
.bprev{position:absolute;top:0;left:0;height:100%;background:transparent;
  border-right:2px solid rgba(91,155,213,.8);z-index:2;pointer-events:none}
.bval{font-size:10px;font-family:var(--mono);color:var(--sub);width:80px;text-align:right;flex-shrink:0}

/* ── Table ── */
.twrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;background:var(--s2);padding:7px 10px;
  text-align:right;font-weight:600;color:var(--sub);border-bottom:2px solid var(--border);
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;white-space:nowrap}
thead th:first-child{text-align:left}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:hover{background:var(--s2)}
tbody td{padding:6px 10px;text-align:right;font-family:var(--mono);font-size:11px}
tbody td:first-child{text-align:left;font-family:var(--sans);font-size:12px}
.tr-total{background:var(--s2)} .tr-total td{color:var(--gold)!important}
td small{display:block;font-size:9px;margin-top:1px}

/* ── Product ── */
.fbar{display:flex;align-items:center;gap:8px;padding:8px 18px;
  background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.flbl{font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill{padding:3px 10px;border-radius:10px;font-size:11px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;transition:.15s}
.pill:hover{color:var(--text);border-color:var(--sub)}
.pill.on{background:var(--gold);border-color:var(--gold);color:#0D0D0D;font-weight:600}
.search{background:var(--s3);border:1px solid var(--border);color:var(--text);
  font-size:12px;padding:4px 10px;border-radius:3px;outline:none;width:200px;font-family:var(--sans);margin-left:auto}
.search::placeholder{color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:14px 18px}
.pcard{background:var(--s1);border:1px solid var(--border);border-radius:4px;padding:9px;transition:.15s;overflow:hidden}
.pcard:hover{border-color:var(--gold);background:var(--s2)}
.pcode{font-size:10px;color:var(--muted);font-family:var(--mono);margin-bottom:3px}
.pname{font-size:11px;color:var(--text);font-weight:500;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.ptag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:2px;
  background:var(--s3);color:var(--muted);margin-right:3px;margin-bottom:2px}
.pamt{font-size:14px;font-weight:700;font-family:var(--mono);color:var(--gold)}
.pcnt{font-size:10px;color:var(--muted);font-family:var(--mono)}
.pbar{height:2px;border-radius:1px;background:var(--gold);margin-top:6px;opacity:.5}
.sec{padding:12px 18px;border-bottom:1px solid var(--border)}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono)}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}
@media print {
  @page { size: A4 portrait; margin: 8mm 8mm; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; box-sizing: border-box !important; }
  body { background: #fff !important; margin: 0 !important; padding: 0 !important; }

  /* ── ヘッダー ── */
  .hdr {
    position: static !important; box-shadow: none !important;
    border-bottom: 1.5px solid #1F4E79 !important;
    padding: 4px 8px !important; display: flex !important;
    align-items: center !important; gap: 8px !important;
    margin-bottom: 6px !important;
  }
  .hdr button, .hdr .seg, .hdr select { display: none !important; }
  .hdr-title { font-size: 12px !important; font-weight: 700 !important; }
  .hdr-badge { font-size: 9px !important; }

  /* ── ナビ・フィルター非表示 ── */
  .nav, .fbar, #stack-filter-bar { display: none !important; }

  /* ── KPI ── */
  .kpi-strip {
    display: flex !important; margin: 0 0 6px 0 !important;
    border: 1px solid #ddd !important; border-radius: 4px !important;
    page-break-after: avoid !important; break-after: avoid !important;
  }
  .kpi { padding: 4px 10px !important; flex: 1 !important; }
  .kpi-lbl { font-size: 8px !important; }
  .kpi-val { font-size: 15px !important; }
  .kpi-sub { font-size: 8px !important; }

  /* ── ページ制御 ── */
  /* P1: overview */
  #pane-overview {
    display: block !important;
    break-before: avoid !important;
    break-after: page !important;
    page-break-after: always !important;
  }
  /* P2: brand + item + table まとめて */
  #pane-brand {
    display: block !important;
    break-before: auto !important;
    break-after: avoid !important;
  }
  #pane-item {
    display: block !important;
    break-before: avoid !important;
    break-after: avoid !important;
    margin-top: 6px !important;
  }
  #pane-table {
    display: block !important;
    break-before: avoid !important;
  }
  /* 品番一覧・フィルターバーは非表示 */
  #pane-product { display: none !important; }

  /* ── カード ── */
  .ccard {
    box-shadow: none !important; border: 1px solid #ddd !important;
    margin-bottom: 5px !important; padding: 6px !important;
    break-inside: avoid !important;
  }
  .cgrid.g2 { grid-template-columns: 1fr 1fr !important; gap: 5px !important; }
  .cgrid.g1 { gap: 0 !important; }
  .ccard-hdr { margin-bottom: 4px !important; }
  .ctitle { font-size: 10px !important; font-weight: 700 !important; }

  /* ── P1 グラフ高さ ── */
  #pane-overview .cwrap.h360 { height: 200px !important; }
  #pane-overview #ov-brand-donut,
  #pane-overview #ov-item-donut { min-height: 170px !important; max-height: 170px !important; overflow: hidden !important; }

  /* ── P2 グラフ高さ（コンパクト） ── */
  #pane-brand .cwrap.h380,
  #pane-item  .cwrap.h380 { height: 150px !important; }

  /* ── Canvas非表示・img差し替え ── */
  canvas { display: none !important; }
  .print-img-replace { max-width: 100% !important; display: block !important; }

  /* ── 集計テーブル ── */
  .sec { break-inside: avoid !important; margin-top: 4px !important; }
  .sec-title { font-size: 9px !important; font-weight: 700 !important; }
  .twrap { overflow: visible !important; max-height: none !important; }
  table { font-size: 6.5px !important; width: 100% !important; border-collapse: collapse !important; }
  th { font-size: 6px !important; padding: 1px 3px !important; }
  td { padding: 1px 3px !important; }
  /* P2では集計テーブルを1つだけ表示（ブランド×月） */
  #pane-table .seg, #pane-table .sec-hdr { display: none !important; }
  #pane-brand .sec { display: block !important; }
  #pane-item  .sec { display: none !important; }   /* アイテムテーブルは省略 */
}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <div class="hdr-mark">TML</div>
  <div class="hdr-title">27PS 展示会発注ダッシュボード</div>
  <div class="hdr-badge">27PS vs 26PS</div>
  <div class="seg" id="metricSeg">
    <button class="seg-btn on" onclick="setMetric('金額',this)">金額</button>
    <button class="seg-btn"    onclick="setMetric('点数',this)">点数</button>
  </div>
  <select class="store-sel" id="storeSel" onchange="onStore()"></select>
  <button onclick="copyShareURL(this)" id="shareBtn" style="
    margin-left:6px;padding:5px 14px;
    background:var(--s1);border:1px solid var(--border2);
    border-radius:5px;color:var(--sub);font-size:12px;font-weight:500;
    cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;
    transition:background .15s
  " onmouseover="this.style.background='var(--s3)'" onmouseout="this.style.background='var(--s1)'">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="4" r="2" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="4"  cy="8" r="2" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="1.2"/>
      <line x1="5.8" y1="7.1" x2="10.2" y2="4.9" stroke="currentColor" stroke-width="1.2"/>
      <line x1="5.8" y1="8.9" x2="10.2" y2="11.1" stroke="currentColor" stroke-width="1.2"/>
    </svg>
    URLをコピー
  </button>
  </div>

<!-- Nav -->
<div class="nav">
  <div class="nav-tab on" onclick="setTab('overview',this)">月別概況</div>
  <div class="nav-tab"    onclick="setTab('brand',this)">ブランド別</div>
  <div class="nav-tab"    onclick="setTab('item',this)">アイテム別</div>
  
  
</div>

<!-- KPI -->
<div class="kpi-strip" id="kpiStrip"></div>

<!-- Main -->
<div class="main">

  <!-- ═══ OVERVIEW ═══ -->
  <div class="pane on" id="pane-overview">
    <!-- ④ 積み上げ表示フィルター -->
    <div class="fbar" id="stack-filter-bar" style="display:none;flex-wrap:wrap;gap:6px">
      <span class="flbl" id="stack-filter-label">ブランド選択：</span>
      <div id="stack-filter-pills" style="display:flex;gap:4px;flex-wrap:wrap"></div>
      <button class="seg-btn on" style="margin-left:auto;border:1px solid var(--border);border-radius:3px;padding:3px 10px;font-size:11px" onclick="selectAllStack(true)">全選択</button>
      <button class="seg-btn" style="border:1px solid var(--border);border-radius:3px;padding:3px 10px;font-size:11px" onclick="selectAllStack(false)">全解除</button>
    </div>

    <!-- 月別受注金額推移（メインチャート） -->
    <div class="cgrid g1" style="padding-bottom:0">
      <div class="ccard">
        <div class="ccard-hdr">
          <div class="ctitle">月別 受注金額推移</div>
          <!-- ① ブランド/アイテム タブ切替 -->
          <div class="seg" id="stackSeg">
            <button class="seg-btn on" onclick="setStack('brand',this)">ブランド</button>
            <button class="seg-btn"    onclick="setStack('item',this)">アイテム</button>
          </div>
          <!-- 凡例トグル（線グラフ3本） -->
          <div class="leg-row" id="ov-legend"></div>
        </div>
        <div class="cwrap h360"><canvas id="c-main"></canvas></div>
      </div>
    </div>

    <!-- 追加: 受注×売上×合算 月別比較（7〜2月通し） -->
    <div class="cgrid g1" style="padding-top:0">
      <div class="ccard">
        <div class="ccard-hdr">
          <div class="ctitle">月別 受注・売上・合算比較（7〜2月）</div>
          <div class="leg-row" id="combo-legend"></div>
        </div>
        <div class="cwrap h360"><canvas id="c-combo"></canvas></div>
      </div>
    </div>

    <!-- ① ドーナツ構成比（ブランド・アイテム） -->
    <div class="cgrid g2" style="padding-top:0">
      <!-- ブランド構成比 -->
      <div class="ccard">
        <div class="ccard-hdr">
          <div class="ctitle">ブランド構成比（外側:27PS / 内側:26PS）</div>
        </div>
        <div id="ov-brand-donut" style="display:flex;justify-content:center;align-items:flex-start;padding:12px 8px;min-height:240px"></div>
      </div>
      <!-- アイテム構成比 -->
      <div class="ccard">
        <div class="ccard-hdr">
          <div class="ctitle">アイテム構成比（外側:27PS / 内側:26PS）</div>
        </div>
        <div id="ov-item-donut" style="display:flex;justify-content:center;align-items:flex-start;padding:12px 8px;min-height:240px"></div>
      </div>
    </div>

  </div>

  <!-- ═══ BRAND ═══ -->
  <div class="pane" id="pane-brand">
    <div class="cgrid g1">
      <div class="ccard">
        <div class="ccard-hdr" style="align-items:center">
          <div class="ctitle">ブランド別 月別推移</div>
        </div>
        <div class="cwrap h380"><canvas id="c-brand-line"></canvas></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-hdr"><div class="sec-title">ブランド × 月 集計</div></div>
      <div class="twrap" id="brand-tbl"></div>
    </div>
  </div>

  <!-- ═══ ITEM ═══ -->
  <div class="pane" id="pane-item">
    <div class="cgrid g1">
      <div class="ccard">
        <div class="ccard-hdr" style="align-items:center">
          <div class="ctitle">アイテム別 月別推移</div>
        </div>
        <div class="cwrap h380"><canvas id="c-item-line"></canvas></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-hdr"><div class="sec-title">アイテム × 月 集計</div></div>
      <div class="twrap" id="item-tbl"></div>
    </div>
  </div>

  <!-- ═══ PRODUCT ═══ -->
  

  <!-- ═══ TABLE ═══ -->

const ICOL = ['#2D5A8E','#5B8DB8','#8BAFD4','#B5CDE4','#C84B31','#E8956D','#A0A0A0','#C0C0C0','#D0C8B8'];

// 凡例トグル状態
const LEG = { order26:true, order25:true, sales25:true, store_sales:true };

// ── Helpers ────────────────────────────────────────
const M = () => curMetric === '点数' ? '点数' : '金額';
const fmt = v => {
  if(v==null||v===0) return '−';
  if(curMetric==='点数') return v.toFixed(0)+'点';
  if(Math.abs(v)>=100000000) return (v/100000000).toFixed(1)+'億';
  if(Math.abs(v)>=10000) return (v/10000).toFixed(0)+'万';
  return v.toFixed(0);
};
const fmtFull = v => v ? (v/10000).toFixed(0)+'万円' : '−';
const vs  = (c,p) => {
  if(!p) return `<span class="neu">−</span>`;
  const r=(c-p)/p*100;
  return `<span class="${r>=0?'up':'dn'}">${r>=0?'+':''}${r.toFixed(1)}%</span>`;
};
const vsS = (c,p) => {
  if(!p) return '';
  const r=(c-p)/p*100;
  return `<small class="${r>=0?'up':'dn'}">${r>=0?'+':''}${r.toFixed(0)}%</small>`;
};

const sd26 = () => DASH_DATA.store_data_26[curStore];
const sd25 = () => DASH_DATA.store_data_25[curStore] || {};

function lookup26(dim, key, month) {
  // Check filter for main chart (stackFilter only applies when dim matches stackMode)
  const src = dim==='brand' ? sd26().month_brand : sd26().month_item;
  const row = src.find(r => r[dim==='brand'?'brand':'item']===key && r.月label===month);
  return row ? row[M()] : 0;
}
function lookup26f(dim, key, month) {
  // filtered version for stack chart
  if(dim===stackMode && !stackFilter[dim].has(key)) return 0;
  return lookup26(dim, key, month);
}
function lookup25f(dim, key, month) {
  if(dim===stackMode && !stackFilter[dim].has(key)) return 0;
  return lookup25(dim, key, month);
}
function lookup25(dim, key, month) {
  const sd = sd25();
  const src = dim==='brand' ? sd.month_brand : sd.month_item;
  if(!src) return 0;
  const row = src.find(r => r[dim==='brand'?'brand':'item']===key && r.月label===month);
  return row ? row[M()] : 0;
}
function mTotal26(m) {
  const r = sd26().month_total.find(x => x.月label===m);
  return r ? r[M()] : 0;
}
function mTotal25(m) {
  const sd = sd25();
  if(!sd.month_total) return 0;
  const r = sd.month_total.find(x => x.月label===m);
  return r ? r[M()] : 0;
}

function dc(id) { if(CHARTS[id]){CHARTS[id].destroy(); delete CHARTS[id];} }

// ── Store / Metric ─────────────────────────────────
function buildStore() {
  const sel = document.getElementById('storeSel');
  STORES.forEach(s => {
    const o = document.createElement('option');
    o.value = s; o.textContent = s; sel.appendChild(o);
  });
}
function onStore() {
  curStore = document.getElementById('storeSel').value;
  // URLを同期
  const params = new URLSearchParams(location.search);
  if(curStore === '全店合計') params.delete('store');
  else params.set('store', curStore);
  const newURL = location.pathname + (params.toString() ? '?' + params.toString() : '');
  history.replaceState(null, '', newURL);
  refresh();
}
function setMetric(m, btn) {
  curMetric = m;
  document.querySelectorAll('#metricSeg .seg-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  refresh();
}
function refresh() { buildKPI(); renderTab(curTab); }

// ── KPI ────────────────────────────────────────────
function buildKPI() {
  const total26 = MONTHS.reduce((s,m) => s+mTotal26(m), 0);
  const total25 = MONTHS.reduce((s,m) => s+mTotal25(m), 0);
  const cnt26 = sd26().month_total.reduce((s,r) => s+r.点数, 0);

  document.getElementById('kpiStrip').innerHTML = `
    <div class="kpi">
      <div class="kpi-lbl">27PS シーズン受注</div>
      <div class="kpi-val">${fmtFull(total26)}</div>
      <div class="kpi-sub">${vs(total26,total25)}<span class="neu">vs 26PS受注</span></div>
    </div>
    <div class="kpi">
      <div class="kpi-lbl">受注点数</div>
      <div class="kpi-val">${cnt26.toFixed(0)}<span style="font-size:12px;color:var(--muted)">点</span></div>
      <div class="kpi-sub"><span class="neu">${curStore}</span></div>
    </div>
    <div class="kpi">
      <div class="kpi-lbl">26PS 受注合計</div>
      <div class="kpi-val" style="color:var(--blue)">${fmtFull(total25)}</div>
      <div class="kpi-sub"><span class="neu">差額 ${total26-total25>=0?'+':''}${fmtFull(total26-total25)}</span></div>
    </div>`;
}

function setTab(name, el) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('pane-'+name).classList.add('on');
  curTab = name; renderTab(name);
}
function renderTab(t) {
  if(t==='overview') buildOverview();
  else if(t==='brand') buildBrand();
  else if(t==='item') buildItem();
  else if(t==='product') renderProds();
  else if(t==='table') buildTbl();
}

// ── 凡例トグル ─────────────────────────────────────
const LEG_DEFS = [
  { key:'order26',      color:'#C9A96E', dash:false, label:'27PS 受注' },
  { key:'order25',      color:'#5B9BD5', dash:true,  label:'26PS 受注' },
  { key:'sales25',      color:'#52C47A', dash:true,  label:'26PS 売上実績（全店）' },
  { key:'store_sales',  color:'#E05858', dash:true,  label:'25年 売上実績（各店）' },
];
function buildLegend() {
  const wrap = document.getElementById('ov-legend');
  wrap.innerHTML = LEG_DEFS.map(d => `
    <button class="leg-btn ${LEG[d.key]?'on':''}" style="color:${d.color}"
      onclick="toggleLeg('${d.key}',this)">
      ${d.dash
        ? `<div class="leg-dash" style="border-top:2px dashed ${d.color}"></div>`
        : `<div class="leg-dot"  style="background:${d.color}"></div>`}
      <span>${d.label}</span>
    </button>`).join('');
}
function toggleLeg(key, el) {
  LEG[key] = !LEG[key];
  el.classList.toggle('on', LEG[key]);
  buildMainChart();
}

// ── メインチャート（線グラフ左軸 + 棒グラフ右軸） ──────
function buildMainChart() {
  dc('c-main');
  const ctx = document.getElementById('c-main').getContext('2d');

  // ② 棒グラフ用データセット — barPercentage:0.4 で幅を半分に
  let barDsets = [];
  const barCols = stackMode==='brand' ? BCOL : ICOL;
  const barKeys = stackMode==='brand' ? BRANDS : ITEMS;
  const barDim  = stackMode==='brand' ? 'brand' : 'item';

  barDsets = barKeys.map((k,i) => ({
    type: 'bar',
    label: k,
    data: MONTHS.map(m => (stackFilter[barDim].has(k) ? lookup26(barDim, k, m) : 0)),
    backgroundColor: barCols[i % barCols.length] + '55',
    borderColor:     barCols[i % barCols.length] + '00',
    stack: 'bars',
    yAxisID: 'yBar',       // 右軸
    order: 3,
    barPercentage: 0.70,   // ③ 棒幅70%
    categoryPercentage: 0.9,
  }));

  // 線グラフ用データセット — 左軸
  const lineDsets = [];
  if(LEG.order26) {
    lineDsets.push({
      type: 'line',
      label: '27PS 受注',
      data: MONTHS.map(m => mTotal26(m)),
      borderColor: '#C9A96E',
      backgroundColor: '#C9A96E11',
      fill: true,
      tension: .4,
      borderWidth: 3,
      pointRadius: 5,
      pointHoverRadius: 7,
      pointBackgroundColor: '#C9A96E',
      yAxisID: 'yLine',    // 左軸
      order: 1,
      z: 10,
    });
  }
  if(LEG.order25) {
    lineDsets.push({
      type: 'line',
      label: '26PS 受注',
      data: MONTHS.map(m => mTotal25(m)),
      borderColor: '#5B9BD5',
      fill: false,
      tension: .4,
      borderWidth: 2.5,
      borderDash: [7, 4],
      pointRadius: 4,
      pointBackgroundColor: '#5B9BD5',
      yAxisID: 'yLine',    // 左軸
      order: 1,
    });
  }
  if(LEG.sales25 && curStore==='全店合計') {
    lineDsets.push({
      type: 'line',
      label: '26PS 売上実績（全店）',
      data: MONTHS.map(m => DASH_DATA.sales_month_total[m] || null),
      borderColor: '#52C47A',
      fill: false,
      tension: .4,
      borderWidth: 2,
      borderDash: [3, 3],
      pointRadius: 4,
      pointBackgroundColor: '#52C47A',
      spanGaps: false,
      yAxisID: 'yLine',
      order: 1,
    });
  }
  // 各店 25年売上実績（store_sales_25）
  if(LEG.store_sales && curStore !== '全店合計') {
    const ss = DASH_DATA.store_sales_25?.[curStore];
    if(ss) {
      lineDsets.push({
        type: 'line',
        label: '25年 売上実績',
        data: MONTHS.map(m => ss[m] || null),
        borderColor: '#E05858',
        fill: false,
        tension: .4,
        borderWidth: 2.5,
        borderDash: [4, 3],
        pointRadius: 4,
        pointBackgroundColor: '#E05858',
        spanGaps: false,
        yAxisID: 'yLine',
        order: 1,
      });
    }
  }

  // 左軸: 実データ最大値に自動追従
  const storeSales = DASH_DATA.store_sales_25?.[curStore];
  const lineVals = [
    ...MONTHS.map(m => mTotal26(m)),
    ...MONTHS.map(m => mTotal25(m)),
    ...(curStore === '全店合計'
      ? MONTHS.map(m => DASH_DATA.sales_month_total[m] || 0)
      : MONTHS.map(m => storeSales?.[m] || 0)),
  ].filter(v => v > 0);
  const lineMax = lineVals.length ? Math.max(...lineVals) * 1.15 : undefined;

  // 右軸: 実データ最大値に自動追従
  const barMax = Math.max(
    ...MONTHS.map(m => barKeys.reduce((s,k) => s + lookup26(barDim,k,m), 0))
  ) * 1.15 || undefined;

  CHARTS['c-main'] = new Chart(ctx, {
    data: { labels: MONTHS, datasets: [...barDsets, ...lineDsets] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode:'index', intersect:false },
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            color: '#4A4540', font:{ size:10 }, boxWidth:10,
            filter: item => {
              // 棒グラフ凡例はブランド/アイテム名のみ表示
              // 線グラフ凡例は LEG ボタンで管理するので非表示
              const lineLabels = ['27PS 受注','26PS 受注','26PS 売上実績'];
              return !lineLabels.includes(item.text);
            }
          }
        },
        tooltip: {
          callbacks: {
            label: c => {
              const v = c.raw || 0;
              if(v===0||v===null) return null;
              if(curMetric==='点数') return c.dataset.label+': '+v.toFixed(0)+'点';
              return c.dataset.label+': '+(v/10000).toFixed(0)+'万';
            }
          }
        }
      },
      scales: {
        x: {
          stacked: true,
          ticks: { color:'#4A4540', font:{size:11} },
          grid:  { color:'#D4CFC7' },
        },
        // 左軸: 線グラフ（受注金額推移）
        yLine: {
          type: 'linear',
          position: 'left',
          stacked: false,
          max: lineMax,
          min: 0,
          ticks: {
            color: '#7A5020',
            font: { size:10 },
            callback: v => {
              if(curMetric==='点数') return v.toFixed(0);
              if(v>=100000000) return (v/100000000).toFixed(1)+'億';
              if(v>=10000000)  return (v/10000000).toFixed(0)+'千万';
              if(v>=1000000)   return (v/1000000).toFixed(0)+'百万';
              if(v>=10000)     return (v/10000).toFixed(0)+'万';
              return v;
            }
          },
          grid: { color:'#D4CFC7' },
          title: { display:true, text:'受注金額 (円)', color:'#9A6F2E', font:{size:9} }
        },
        // 右軸: 棒グラフ（積み上げ）
        yBar: {
          type: 'linear',
          position: 'right',
          stacked: true,
          max: barMax,
          min: 0,
          ticks: {
            color: '#2666AA99',
            font: { size:10 },
            callback: v => {
              if(curMetric==='点数') return v.toFixed(0);
              if(v>=100000000) return (v/100000000).toFixed(1)+'億';
              if(v>=10000000)  return (v/10000000).toFixed(0)+'千万';
              if(v>=1000000)   return (v/1000000).toFixed(0)+'百万';
              if(v>=10000)     return (v/10000).toFixed(0)+'万';
              return v;
            }
          },
          grid: { drawOnChartArea:false },
          title: {
            display: true,
            text: stackMode==='brand'?'ブランド別積み上げ':'アイテム別積み上げ',
            color: '#2666AA88', font:{size:9}
          }
        }
      }
    }
  });
}

  const ctx = el.getContext('2d');
  const FM = DASH_DATA.full_months;
  const c = (DASH_DATA.combo && DASH_DATA.combo[curStore]) ? DASH_DATA.combo[curStore] : null;
  const pick = o => FM.map(m => (o && o[m]!=null ? o[m] : 0));
  const dsets = [];
  if(!c){ if(CHARTS['c-combo']){} return; }
  dsets.push({ type:'line', label:'25年 店頭売上実績', data:pick(c.sales25),
    borderColor:'#52C47A', borderDash:[2,3], fill:false, tension:.4, borderWidth:2,
    pointRadius:3, pointHoverRadius:6, pointBackgroundColor:'#52C47A' });
  dsets.push({ type:'line', label:'26FW+27PS 合算', data:pick(c.combo_cur),

    pointRadius:4, pointHoverRadius:6, pointBackgroundColor:'#9A6F2E' });
  dsets.push({ type:'line', label:'25FW+26PS 合算（前年）', data:pick(c.combo_prev),
    borderColor:'#C0392B', borderDash:[6,4], fill:false, tension:.4, borderWidth:2,

// ── 月別概況 ドーナツ2枚（ブランド構成比・アイテム構成比） ──
function buildOverviewDonuts() {
  buildOverviewDonut('brand');
  buildOverviewDonut('item');
}

function buildOverviewDonut(type) {
  const containerId = type === 'brand' ? 'ov-brand-donut' : 'ov-item-donut';
  const container = document.getElementById(containerId);
  if(!container) return;
  container.innerHTML = '';

  const keys  = type === 'brand' ? BRANDS : ITEMS;
  const cols  = type === 'brand' ? BCOL   : ICOL;
  const lookup26fn = (k) => MONTHS.reduce((s,m) => s + lookup26(type, k, m), 0);
  const lookup25fn = (k) => MONTHS.reduce((s,m) => s + lookup25(type, k, m), 0);

  const vals26  = keys.map(lookup26fn);
  const vals25  = keys.map(lookup25fn);
  const total26 = vals26.reduce((a,b)=>a+b,0) || 1;
  const total25 = vals25.reduce((a,b)=>a+b,0) || 1;
  const r26 = vals26.map(v => v/total26*100);
  const r25 = vals25.map(v => v/total25*100);

  drawSvgDonut(container, keys, cols, r26, r25, total26, total25,
    type === 'brand' ? 'ブランド' : 'アイテム');
}

// ── 汎用SVGドーナツ描画（mito_dashboard 準拠） ──────────
function drawSvgDonut(container, keys, cols, r26, r25, total26, total25, label) {
  const NS = 'http://www.w3.org/2000/svg';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;gap:16px;align-items:flex-start;width:100%';

  // ── SVG部分 ──
  const svgWrap = document.createElement('div');
  svgWrap.style.cssText = 'position:relative;width:190px;height:190px;flex-shrink:0';
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('width','190'); svg.setAttribute('height','190');
  svg.setAttribute('viewBox','0 0 200 200');

  const cx=100, cy=100, rO=88, rM=67, rI=46, GAP=1.8;

  function drawRing(ratios, ro, ri, opacity) {
    let start = -90;
    ratios.forEach((pct, i) => {
      const sweep = pct/100*360;
      if(pct >= 0.3) {
        const end = start + sweep - GAP;
        const s = start*Math.PI/180, e = end*Math.PI/180;
        const large = (sweep - GAP) > 180 ? 1 : 0;
        const x1=cx+ro*Math.cos(s), y1=cy+ro*Math.sin(s);
        const x2=cx+ro*Math.cos(e), y2=cy+ro*Math.sin(e);
        const x3=cx+ri*Math.cos(e), y3=cy+ri*Math.sin(e);
        const x4=cx+ri*Math.cos(s), y4=cy+ri*Math.sin(s);
        const path = document.createElementNS(NS,'path');
        path.setAttribute('d',`M${x1} ${y1}A${ro} ${ro} 0 ${large} 1 ${x2} ${y2}L${x3} ${y3}A${ri} ${ri} 0 ${large} 0 ${x4} ${y4}Z`);
        path.setAttribute('fill', cols[i] || '#ccc');
        path.setAttribute('opacity', opacity);
        const t = document.createElementNS(NS,'title');
        const name = typeof keys[i]==='string' ? keys[i].replace(/^\d+/,'') : keys[i];
        t.textContent = `${name}: ${pct.toFixed(1)}%`;
        path.appendChild(t);
        svg.appendChild(path);
      }
      start += sweep;
    });
  }

  drawRing(r26, rO, rM+1, '0.95');   // 外環: 27PS
  drawRing(r25, rM-1, rI, '0.80');   // 内環: 26PS（やや薄く）

  // 区切り白円
  const sep = document.createElementNS(NS,'circle');
  sep.setAttribute('cx',cx); sep.setAttribute('cy',cy); sep.setAttribute('r',rM);
  sep.setAttribute('fill','none'); sep.setAttribute('stroke','#fff'); sep.setAttribute('stroke-width','2.5');
  svg.appendChild(sep);

  // ラベル（白文字）
  function addLabel(text, r, angleDeg) {
    const a = angleDeg*Math.PI/180;
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x', cx+r*Math.cos(a)); t.setAttribute('y', cy+r*Math.sin(a)+4);
    t.setAttribute('text-anchor','middle'); t.setAttribute('font-size','9');
    t.setAttribute('font-weight','700'); t.setAttribute('fill','#fff');
    t.textContent = text; svg.appendChild(t);
  }
  addLabel('27PS', (rO+rM)/2, -75);
  addLabel('26PS', (rM+rI)/2, -75);

  svgWrap.appendChild(svg);

  // 中央テキスト
  const ci = document.createElement('div');
  ci.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:82px';
  const ratio = total25>0 ? ((total26-total25)/total25*100) : 0;
  const rColor = ratio >= 0 ? '#1E8A4A' : '#C84B31';
  ci.innerHTML = `<div style="font-size:14px;font-weight:700;color:var(--text);line-height:1.1">${(total26/10000).toFixed(0)}万</div>
    <div style="font-size:9px;color:var(--muted)">27PS受注</div>
    <div style="font-size:11px;font-weight:700;color:${rColor};margin-top:4px">${ratio>=0?'+':''}${ratio.toFixed(1)}%</div>
    <div style="font-size:9px;color:var(--muted)">${(total25/10000).toFixed(0)}万前年</div>`;
  svgWrap.appendChild(ci);

  // ── 凡例部分 ──
  const legWrap = document.createElement('div');
  legWrap.style.cssText = 'display:flex;flex-direction:column;gap:4px;justify-content:center;flex:1;min-width:0;padding-top:8px';

  // 年ラベル
  const yearRow = document.createElement('div');
  yearRow.style.cssText = 'display:flex;gap:10px;margin-bottom:4px';
  yearRow.innerHTML = `
    <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--sub)">
      <div style="width:14px;height:8px;border-radius:2px;background:var(--text);opacity:.7"></div>外: 27PS
    </div>
    <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--sub)">
      <div style="width:14px;height:8px;border-radius:2px;background:var(--text);opacity:.4"></div>内: 26PS
    </div>`;
  legWrap.appendChild(yearRow);

  keys.forEach((k, i) => {
    const v26 = r26[i]||0, v25 = r25[i]||0;
    if(v26 < 0.3 && v25 < 0.3) return;
    const name = typeof k==='string' ? k.replace(/^\d+/,'') : k;
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:5px;font-size:10px;';
    row.innerHTML = `
      <div style="width:8px;height:8px;border-radius:2px;background:${cols[i]||'#ccc'};flex-shrink:0;
                  border:1.5px solid white;outline:1px solid ${cols[i]||'#ccc'}55"></div>
      <span style="color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</span>
      <span style="font-family:var(--mono);color:var(--text);font-size:10px">${v26.toFixed(1)}%</span>
      <span style="font-family:var(--mono);color:var(--blue);font-size:10px">${v25.toFixed(1)}%</span>`;
    legWrap.appendChild(row);
  });

  wrap.appendChild(svgWrap);
  wrap.appendChild(legWrap);
  container.appendChild(wrap);
}

function buildStack100Type(type) {
  const keys   = type==='brand' ? BRANDS : ITEMS;
  const cols   = type==='brand' ? BCOL   : ICOL;
  const dim    = type;
  const wrapId = type+'-stack100';
  const legId  = type+'-stack100-leg';

  // ⑤⑥ シーズン合計で27PS vs 26PS の2本バー
  const vals26 = keys.map(k => stackFilter[dim].has(k) ? MONTHS.reduce((s,m) => s+lookup26(dim,k,m), 0) : 0);
  const vals25 = keys.map(k => stackFilter[dim].has(k) ? MONTHS.reduce((s,m) => s+lookup25(dim,k,m), 0) : 0);
  const total26 = vals26.reduce((a,b)=>a+b,0);
  const total25 = vals25.reduce((a,b)=>a+b,0);

  const makeBar = (vals, total) => {
    if(total===0) return `<div class="s100-bar" style="background:var(--s3);height:28px"></div>`;
    const segs = vals.map((v,i) => {
      const pct = (v/total*100);
      if(pct < 0.3) return '';
      const name = type==='brand' ? keys[i].replace(/^\d+/,'') : keys[i];
      const tip = `${name}: ${pct.toFixed(1)}%`;
      return `<div class="s100-seg" data-tip="${tip}" style="width:${pct.toFixed(2)}%;background:${cols[i%cols.length]};height:100%"></div>`;
    }).join('');
    return `<div class="s100-bar" style="height:28px">${segs}</div>`;
  };

  const html = `
    <div class="s100-row">
      <div class="s100-lbl" style="font-size:12px;color:var(--text);font-weight:500">27PS</div>
      <div style="flex:1">${makeBar(vals26, total26)}</div>
      <div class="s100-total" style="font-size:11px;color:var(--text);font-family:var(--mono)">${total26?(total26/10000).toFixed(0)+'万':'-'}</div>
    </div>
    <div class="s100-row" style="margin-top:8px">
      <div class="s100-lbl" style="font-size:12px;color:var(--blue);font-weight:500">26PS</div>
      <div style="flex:1">${makeBar(vals25, total25)}</div>
      <div class="s100-total" style="font-size:11px;color:var(--blue);font-family:var(--mono)">${total25?(total25/10000).toFixed(0)+'万':'-'}</div>
    </div>`;

  document.getElementById(wrapId).innerHTML = html;

  // 凡例
  document.getElementById(legId).innerHTML =
    `<div style="display:flex;align-items:center;gap:6px;margin-right:12px">
       <div style="width:20px;height:4px;background:var(--text);border-radius:1px;opacity:.6"></div>
       <span style="font-size:10px;color:var(--sub)">27PS</span>
     </div>
     <div style="display:flex;align-items:center;gap:6px;margin-right:16px">
       <div style="width:20px;height:4px;background:var(--blue);border-radius:1px;opacity:.6"></div>
       <span style="font-size:10px;color:var(--sub)">26PS</span>
     </div>`
    + keys.map((k,i) =>
      `<div class="s100-leg-item">
         <div class="s100-leg-dot" style="background:${cols[i%cols.length]}"></div>
         <span>${type==='brand'?k.replace(/^\d+/,''):k}</span>
       </div>`
    ).join('');
}

// ── Brand Tab ──────────────────────────────────────
function buildBrand() {
  dc('br-line');
  const ctx = document.getElementById('c-brand-line').getContext('2d');

  // ② 隣接配置: 月ごとに27PS棒(stack=s26)と26PS棒(stack=s25)を横並び
  // ① 軸スケールは実データの最大値に自動追従
  const dsets26 = BRANDS.map((b,i) => ({
    label: b,
    data: MONTHS.map(m => lookup26('brand',b,m)),
    backgroundColor: BCOL[i%8],
    borderColor: '#ffffff',
    borderWidth: 1.5,
    stack: 's26',
    order: 1,
  }));
  const dsets25 = BRANDS.map((b,i) => ({
    label: b + '__25',   // 凡例非表示用サフィックス
    data: MONTHS.map(m => lookup25('brand',b,m)),
    backgroundColor: BCOL[i%8] + 'AA',
    borderColor: '#ffffff',
    borderWidth: 1,
    stack: 's25',
    order: 2,
  }));

  // ① 実データ最大値で自動スケール（固定値なし）

              if(v>=1000000)  return (v/1000000).toFixed(0)+'百万';
              if(v>=10000)    return (v/10000).toFixed(0)+'万';

  let th = `<thead><tr><th>ブランド</th>${MONTHS.map(m=>`<th>${m}</th>`).join('')}<th>合計</th><th>前年合計</th><th>前年比</th></tr></thead>`;

    tb += `<td>${fmt(c26)}</td><td style="color:var(--blue)">${fmt(c25)}</td><td>${vs(c26,c25)}</td></tr>`;
  });
  tb += `<tr class="tr-total"><td>合計</td>${MONTHS.map(m=>`<td>${fmt(t26[m])}${vsS(t26[m],t25[m])}</td>`).join('')}<td>${fmt(g26)}</td><td style="color:var(--blue)">${fmt(g25)}</td><td>${vs(g26,g25)}</td></tr></tbody>`;

// ── ④ Stack filter ─────────────────────────────────
let stackFilter = { brand: new Set(BRANDS), item: new Set(ITEMS) };

function buildStackFilterPills() {
  const keys = stackMode==='brand' ? BRANDS : ITEMS;
  const bar  = document.getElementById('stack-filter-bar');
  const lbl  = document.getElementById('stack-filter-label');
  const wrap = document.getElementById('stack-filter-pills');
  bar.style.display = 'flex';
  lbl.textContent   = (stackMode==='brand' ? 'ブランド' : 'アイテム') + '選択：';
  const active = stackFilter[stackMode];
  wrap.innerHTML = keys.map(k => {
    const name = stackMode==='brand' ? k.replace(/^\d+/,'') : k;
    return `<span class="pill ${active.has(k)?'on':''}" onclick="toggleStackKey('${k}',this)">${name}</span>`;
  }).join('');
}
function toggleStackKey(k, el) {
  const set = stackFilter[stackMode];
  if(set.has(k)) { set.delete(k); el.classList.remove('on'); }
  else           { set.add(k);    el.classList.add('on'); }
  buildMainChart();
  buildStack100();
}
function selectAllStack(flag) {
  const keys = stackMode==='brand' ? BRANDS : ITEMS;
  const set  = stackFilter[stackMode];
  if(flag) keys.forEach(k => set.add(k)); else set.clear();
  buildStackFilterPills();
  buildMainChart();
  buildStack100();
}

// Override setStack to also refresh filter pills
function setStack(mode, btn) {
  stackMode = mode;
  document.querySelectorAll('#stackSeg .seg-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  buildStackFilterPills();
  buildMainChart();
  buildStack100();
}

function copyShareURL(btn) {
  const url = location.href;
  navigator.clipboard.writeText(url).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><polyline points="2,8 6,13 14,3" stroke="#1E8A4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> コピーしました`;
    btn.style.borderColor = '#1E8A4A';
    btn.style.color = '#1E8A4A';
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 2000);
  }).catch(() => {
    // fallback: prompt
    prompt('以下のURLをコピーしてください：', url);
  });
}

(function initFromURL() {
  const params = new URLSearchParams(location.search);
  const storeParam = params.get('store');
  const tabParam   = params.get('tab');

  if(storeParam) {
    // 完全一致 → 部分一致フォールバック
    const match = STORES.find(s => s === storeParam)
                || STORES.find(s => s.includes(storeParam));
    if(match) {
      curStore = match;
      const sel = document.getElementById('storeSel');
      if(sel) {
        // プルダウンを「全店合計」と「自店舗」のみに絞り込む
        Array.from(sel.options).forEach(opt => {
          if(opt.value !== '全店合計' && opt.value !== match) {
            opt.style.display = 'none';
            opt.disabled = true;
          }
        });
        sel.value = match;
      }
    }
  }
  if(tabParam && ['overview','brand','item','product','table'].includes(tabParam)) {
    const targetTab = document.querySelector(`.nav-tab[onclick*="setTab('${tabParam}'"]`);
    if(targetTab) { setTab(tabParam, targetTab); return; }
  }
  refresh();
})();
</script>
</body>
</html>
